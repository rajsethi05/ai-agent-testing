name: Regression Tests

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

  schedule:
    - cron: "0 9 1,15 * *"  # 1st and 15th of every month at 9:00 AM UTC

  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "sanity"
        type: choice
        options:
          - sanity
          - full

jobs:
  regression:
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'sanity' }} suite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUITE_MAX_CASES: ${{ github.event_name != 'workflow_dispatch' && '3' || inputs.suite == 'sanity' && '3' || '' }}
          SUITE_MAX_INJECTION: ${{ github.event_name != 'workflow_dispatch' && '3' || inputs.suite == 'sanity' && '3' || '' }}
        run: python scripts/run_regression.py --suite ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'sanity' }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: reports/regression_*.html
          retention-days: 30
